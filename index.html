<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Site</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;

            height: 100%;

            font-family: Arial, sans-serif;
        }


        /* =================================
           FIRST PAGE - REGISTRATION
        ================================= */

        #registrationPage {

            width: 100%;

            height: 100vh;

            background-image: url("https://img.magnific.com/free-photo/office-desk-workspace-bright-color-yellow-background_169016-38713.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            position: relative;
        }


        /* Registration area */

        .registration {

            position: absolute;

            left: 10%;

            top: 50%;

            transform: translateY(-50%);

            width: 320px;
        }


        /* Registration Site heading */

        .registration h1 {

            color: green;

            font-size: 32px;

            margin: 0 0 25px 0;

            text-align: left;
        }


        /* Username + Password */

        .registration input {

            width: 100%;

            height: 50px;

            padding: 12px 15px;

            margin-bottom: 15px;

            background: white;

            color: black;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            outline: none;
        }


        /* Placeholder */

        .registration input::placeholder {

            color: #555;

            opacity: 1;
        }


        /* Register button */

        .registration button {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 6px;

            background: #1769aa;

            color: white;

            font-size: 17px;

            cursor: pointer;
        }


        .registration button:hover {

            background: #0d4f82;
        }



        /* =================================
           SECOND PAGE
        ================================= */

        #successPage {

            display: none;

            width: 100%;

            height: 100vh;

            background-image: url("https://live.staticflickr.com/6068/6065510171_bb00e7222b_z.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            position: relative;

            color: white;
        }


        /* Second page content */

        .successContent {

            position: absolute;

            left: 10%;

            top: 20%;

            max-width: 650px;
        }


        /* Success heading */

        .successContent h1 {

            font-size: 42px;

            margin: 0 0 20px 0;
        }


        /* Message */

        .successContent p {

            font-size: 20px;

            line-height: 1.6;

            margin: 10px 0;
        }


        /* IAS YAS Highlight */

        .highlightMessage {

            color: red;

            font-size: 24px;

            font-weight: bold;

            text-shadow: 2px 2px 4px black;

        }


        /* Back button */

        .successContent button {

            margin-top: 20px;

            padding: 12px 30px;

            border: none;

            border-radius: 6px;

            background: #1769aa;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        .successContent button:hover {

            background: #0d4f82;
        }



        /* =================================
           MOBILE SCREEN
        ================================= */

        @media (max-width: 600px) {

            .registration {

                left: 7%;

                width: 86%;
            }


            .successContent {

                left: 7%;

                width: 86%;

                top: 15%;
            }


            .successContent h1 {

                font-size: 32px;
            }


            .successContent p {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         FIRST PAGE
    ================================= -->

    <div id="registrationPage">


        <div class="registration">


            <h1>
                Registration Site
            </h1>


            <form onsubmit="showSuccessPage(event)">


                <!-- Username -->

                <input

                    type="text"

                    placeholder="Username"

                    required

                >


                <!-- Password -->

                <input

                    type="password"

                    placeholder="Password"

                    required

                >


                <!-- Register -->

                <button type="submit">

                    Register

                </button>


            </form>


        </div>


    </div>



    <!-- =================================
         SECOND PAGE
    ================================= -->

    <div id="successPage">


        <div class="successContent">


            <h1>
                Registration Successful
            </h1>


            <p>
                Your registration has been completed successfully.
            </p>


            <p class="highlightMessage">
                IAS YAS bano desh ka naam roshan karo
            </p>


            <!-- BACK BUTTON -->

            <button onclick="goBack()">

                Back

            </button>


        </div>


    </div>



    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>


        /* Register button */

        function showSuccessPage(event) {

            event.preventDefault();


            document.getElementById("registrationPage").style.display = "none";


            document.getElementById("successPage").style.display = "block";

        }



        /* Back button */

        function goBack() {

            document.getElementById("successPage").style.display = "none";


            document.getElementById("registrationPage").style.display = "block";

        }


    </script>


</body>

</html>
